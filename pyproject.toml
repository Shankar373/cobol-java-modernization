[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-java-platform"
version = "2.0.0"
description = "Canonical COBOL to Native Java Modernization Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Modernization Architecture Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "jinja2>=3.1.0",
    "pytest>=8.0.0",
]

[project.scripts]
cjp = "src.cjp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "modernize*", "execution*", "audit*", "tools*"]
